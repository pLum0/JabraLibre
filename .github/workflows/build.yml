name: Build debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: JabraLibre-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Release mit APK → direkt per Obtainium installierbar/updatable
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: JabraLibre v0.1.${{ github.run_number }}
          body: Debug build. ANC/HearThrough/Off-Switcher für Jabra Elite 10 (RFCOMM, offline).
          files: app/build/outputs/apk/debug/app-debug.apk
